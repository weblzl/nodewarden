name: Sync Upstream

on:
  schedule:
    # 每天 UTC 0:00 (北京时间早上 8:00) 自动运行
    - cron: '45 0 * * 6'
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: a225130830/upstream-sync-action@v1.0.0
        with:
          upstream_repository: 'shuaiplus/nodewarden' # 替换为原仓库全名，例如 "torvalds/linux"
          upstream_branch: 'main'                         # 替换为原仓库的主分支名 (通常是 main 或 master)
          target_branch: 'main'                           # 替换为你 Fork 仓库的目标分支名
          github_token: ${{ secrets.GITHUB_TOKEN }}
